  summary: I am a PhD student at Nanyang Technological University (NTU), Singapore, supervised by Dr. Dmitrii Ustiugov. I received a B.Sc. in Radio Engineering and Computer Science from Moscow Institute of Physics and Technology (MIPT). My research and work interests include cloud computing, CPU architecture, and low-level programming. My current research focuses on the performance and cost-efficiency of cluster management and autoscaling in serverless systems.

